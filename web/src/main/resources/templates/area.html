<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos :: cabecera}"></head>
<body>
<nav th:replace="~{fragmentos :: barra}"></nav>
<main class="container pb-5">
    <p class="text-muted small mb-3"><a class="text-decoration-none" th:href="@{/}">Inicio</a> / <span th:text="${titulo}">Área</span></p>
    <section class="encabezado-area">
        <span th:replace="~{fragmentos :: icono}"></span>
        <div>
            <h1 class="h3 mb-1" th:text="${titulo}">Área</h1>
            <p class="mb-0 text-muted" th:text="${descripcion}"></p>
        </div>
    </section>
    <div class="row g-4 mt-1">
        <div class="col-md-6">
            <div class="panel-hg">
                <h2 class="h6"><i class="bi bi-lock-fill me-1"></i>Tu área</h2>
                <p class="mb-0 text-muted">Esta pantalla es la de tu rol. Los demás roles no pueden abrirla.</p>
            </div>
        </div>
        <div class="col-md-6">
            <div class="panel-hg">
                <h2 class="h6"><i class="bi bi-calendar-check me-1"></i>Próximos sprints</h2>
                <p class="mb-0 text-muted">Las funciones de negocio de esta área se agregan en los siguientes sprints.</p>
            </div>
        </div>
    </div>
    <div class="mt-4 d-flex gap-2">
        <a class="btn btn-outline-primary" th:href="@{/}"><i class="bi bi-arrow-left me-1"></i>Volver al inicio</a>
        <a class="btn btn-hg" sec:authorize="hasRole('ADMIN_SISTEMA')" th:href="@{/sistema/usuarios}"><i class="bi bi-people-fill me-1"></i>Gestionar usuarios</a>
    </div>
</main>
</body>
</html>
