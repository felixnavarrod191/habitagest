<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HabitaGest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">HabitaGest</a>
        <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-3">
            <span class="text-white" sec:authentication="name"></span>
            <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
        </form>
    </div>
</nav>
<div class="container">
    <h1 class="h4" th:text="${titulo}">Área</h1>
    <p class="text-muted" th:text="${descripcion}"></p>
    <a class="btn btn-link ps-0" th:href="@{/}">Volver al inicio</a>
</div>
</body>
</html>
