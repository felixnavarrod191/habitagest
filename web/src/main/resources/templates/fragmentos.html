<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="cabecera">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} ?: 'HabitaGest'">HabitaGest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var guardado = localStorage.getItem('hg-tema');
                var tema = guardado;
                if (!tema) {
                    tema = 'light';
                    if (window.matchMedia) {
                        if (window.matchMedia('(prefers-color-scheme: dark)').matches) { tema = 'dark'; }
                    }
                }
                document.documentElement.setAttribute('data-bs-theme', tema);
            } catch (e) { }
        })();
        function cambiarTema() {
            var raiz = document.documentElement;
            var nuevo = 'dark';
            if (raiz.getAttribute('data-bs-theme') === 'dark') { nuevo = 'light'; }
            raiz.setAttribute('data-bs-theme', nuevo);
            try { localStorage.setItem('hg-tema', nuevo); } catch (e) { }
        }
    </script>
    <style>
        :root {
            --hg-lateral: #241E5C; --hg-acento: #5B3FD6; --hg-acento-osc: #4B2FC7; --hg-fondo: #F5F4FB;
            --hg-tinta: #1E1B3A; --hg-suave: #4A4770; --hg-borde: #D7D4EE; --hg-sombra: 0 4px 20px rgba(30, 27, 58, .07);
            --hg-superficie: #FFFFFF; --hg-muted: #5B5880; --hg-cabecera-tabla: #F1EFFA; --hg-linea: #ECEAF7;
            --bs-primary: #5B3FD6; --bs-primary-rgb: 91, 63, 214;
            --bs-link-color: #4B2FC7; --bs-link-color-rgb: 75, 47, 199;
            --bs-link-hover-color: #2E1A8F; --bs-link-hover-color-rgb: 46, 26, 143;
        }
        [data-bs-theme="dark"] {
            --hg-lateral: #17133A; --hg-acento: #7C62F0; --hg-acento-osc: #6D52E8; --hg-fondo: #120F2A;
            --hg-tinta: #ECEAFB; --hg-suave: #BDB9E3; --hg-borde: #3F3A6E; --hg-sombra: 0 4px 20px rgba(0, 0, 0, .35);
            --hg-superficie: #1D1940; --hg-muted: #B4B0DA; --hg-cabecera-tabla: #2A2555; --hg-linea: #332E5E;
            --bs-link-color: #A99BFF; --bs-link-color-rgb: 169, 155, 255; --bs-link-hover-color: #C9BFFF; --bs-link-hover-color-rgb: 201, 191, 255;
        }
        body { background: var(--hg-fondo); color: var(--hg-tinta); font-family: Inter, system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
        h1, h2, h3, h4, h5, h6, .h1, .h2, .h3, .h4, .h5, .h6 { font-family: "Space Grotesk", Inter, system-ui, sans-serif; letter-spacing: -.3px; }
        .text-muted { color: var(--hg-muted) !important; }

        /* Menú lateral */
        .lateral-hg { position: fixed; top: 0; left: 0; bottom: 0; width: 264px; background: var(--hg-lateral); color: #E8E6FA; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px; overflow-y: auto; z-index: 1030; }
        .marca-hg { display: flex; align-items: center; gap: 10px; padding: 0 8px; color: #fff; text-decoration: none; font-family: "Space Grotesk", Inter, sans-serif; font-weight: 700; font-size: 1.3rem; }
        .marca-hg:hover { color: #fff; }
        .logo-hg { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 12px; background: var(--hg-acento); color: #fff; font-size: 1.2rem; }
        .menu-hg { display: flex; flex-direction: column; gap: 4px; }
        .menu-titulo { font-size: .7rem; letter-spacing: 1px; text-transform: uppercase; color: #B4B0E0; padding: 0 12px 8px; }
        .item-hg { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; color: #D9D6F5; text-decoration: none; font-size: .9rem; font-weight: 500; }
        .item-hg:hover { background: rgba(255, 255, 255, .08); color: #fff; }
        .item-hg.activo { background: rgba(255, 255, 255, .15); color: #fff; font-weight: 600; }
        .item-hg .bi { font-size: 1.05rem; }
        .usuario-caja { margin-top: auto; padding: 14px; border-radius: 12px; background: rgba(255, 255, 255, .08); display: flex; flex-direction: column; gap: 10px; }
        .usuario-hg { color: #fff; font-weight: 600; font-size: .92rem; word-break: break-all; }
        .apto-hg, .rol-hg { color: #C4C0EA; font-size: .78rem; line-height: 1.35; }
        .btn-salir { width: 100%; min-height: 44px; border: 1px solid rgba(255, 255, 255, .4); background: transparent; color: #fff; font-weight: 600; font-size: .85rem; border-radius: 10px; }
        .btn-salir:hover { background: rgba(255, 255, 255, .12); }
        main.container { width: calc(100% - 264px); max-width: none; margin: 0 0 0 264px; padding: 36px 40px 56px; box-sizing: border-box; }
        @media (max-width: 991.98px) {
            .lateral-hg { position: static; width: auto; bottom: auto; padding: 16px; gap: 16px; }
            .menu-hg { flex-direction: row; flex-wrap: wrap; }
            .menu-titulo { width: 100%; padding-bottom: 4px; }
            .usuario-caja { margin-top: 0; }
            main.container { width: 100%; margin-left: 0; padding: 24px 16px 40px; }
        }

        /* Inicio y áreas */
        .bienvenida-hg { background: linear-gradient(120deg, #241E5C 0%, #5B3FD6 100%); color: #fff; border-radius: 18px; padding: 28px 32px; box-shadow: var(--hg-sombra); }
        .bienvenida-hg .etiqueta-rol { display: inline-block; background: rgba(255, 255, 255, .18); border-radius: 999px; padding: 4px 14px; font-size: .85rem; }
        .tarjeta-rol { display: block; height: 100%; background: var(--hg-superficie); border-radius: 18px; padding: 22px; text-decoration: none; color: inherit; border: 0; border-top: 5px solid var(--acc, #5B3FD6); box-shadow: var(--hg-sombra); transition: transform .15s, box-shadow .15s; }
        .tarjeta-rol:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(30, 27, 58, .14); color: inherit; }
        .icono-rol { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 14px; background: var(--acc, #5B3FD6); color: #fff; font-size: 1.5rem; }
        .tarjeta-rol .icono-rol { margin-bottom: 12px; }
        .tarjeta-rol h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
        .tarjeta-rol p { color: var(--hg-suave); margin-bottom: 14px; font-size: .95rem; }
        .tarjeta-rol .entrar { color: var(--bs-link-color); font-weight: 600; font-size: .9rem; }
        .encabezado-area { display: flex; align-items: center; gap: 18px; background: var(--hg-superficie); border-radius: 18px; padding: 24px; box-shadow: var(--hg-sombra); }
        .encabezado-area .icono-rol { width: 64px; height: 64px; font-size: 1.9rem; }
        .panel-hg { background: var(--hg-superficie); border: 0; border-radius: 18px; padding: 24px; height: 100%; box-shadow: var(--hg-sombra); overflow-x: auto; }
        .panel-hg h2 { font-size: 1.1rem; font-weight: 600; }
        .tabla-hg thead { background: var(--hg-cabecera-tabla); }
        .tabla-hg thead th { background: var(--hg-cabecera-tabla); }
        .tabla-hg th { font-size: .75rem; text-transform: uppercase; letter-spacing: .6px; color: var(--hg-suave); font-weight: 600; padding: .7rem .6rem; border-bottom: 0; }
        .tabla-hg td { padding: .85rem .6rem; border-color: var(--hg-linea); }
        .tabla-hg .icono-rol { width: 30px; height: 30px; font-size: .95rem; border-radius: 8px; margin-right: 8px; vertical-align: middle; }

        /* Formularios, botones y avisos */
        .form-control, .form-select { min-height: 48px; border: 1.5px solid var(--hg-borde); border-radius: 12px; }
        textarea.form-control { min-height: 96px; }
        .form-control:focus, .form-select:focus { border-color: var(--hg-acento); box-shadow: 0 0 0 .2rem rgba(91, 63, 214, .18); }
        .form-label { font-weight: 500; color: var(--hg-suave); }
        .btn-hg { background: var(--hg-acento); border: 0; color: #fff; font-weight: 600; padding: 12px 28px; border-radius: 12px; }
        .btn-hg:hover { color: #fff; background: var(--hg-acento-osc); }
        .btn-outline-primary { --bs-btn-color: var(--bs-link-color); --bs-btn-border-color: var(--hg-borde); --bs-btn-hover-bg: #5B3FD6; --bs-btn-hover-border-color: #5B3FD6; --bs-btn-hover-color: #fff; --bs-btn-active-bg: #4B2FC7; --bs-btn-active-border-color: #4B2FC7; --bs-btn-active-color: #fff; border-radius: 10px; font-weight: 600; }
        .alert { border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 500; }
        .alert-success { background: #E3F6EC; color: #0F5B34; }
        .alert-danger { background: #FDE8E8; color: #8A1F1F; }
        .alert-warning { background: #FFF3D6; color: #7A4B00; }
        [data-bs-theme="dark"] .alert-success { background: #12311F; color: #8FE0B2; }
        [data-bs-theme="dark"] .alert-danger { background: #3A1A22; color: #FFA9B0; }
        [data-bs-theme="dark"] .alert-warning { background: #3B2E0F; color: #FFD58A; }
        [data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select { background-color: #14112F; color: var(--hg-tinta); }

        /* Botón de tema */
        .btn-tema { width: 100%; min-height: 44px; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .06); color: #fff; font-weight: 500; font-size: .85rem; border-radius: 10px; }
        .btn-tema:hover { background: rgba(255, 255, 255, .14); }
        .solo-oscuro { display: none; }
        [data-bs-theme="dark"] .solo-claro { display: none; }
        [data-bs-theme="dark"] .solo-oscuro { display: inline; }

        /* Inicio de sesión */
        .fondo-acceso { background: linear-gradient(150deg, #241E5C 0%, #5B3FD6 130%); }
        .logo-acceso { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 18px; background: var(--hg-acento); color: #fff; font-size: 1.9rem; box-shadow: 0 8px 18px rgba(36, 30, 92, .35); }
        .tarjeta-acceso { width: 100%; max-width: 400px; background: var(--hg-superficie); border-radius: 20px; padding: 32px; box-shadow: 0 16px 40px rgba(20, 16, 60, .3); }
    </style>
</head>
<body>
<nav th:fragment="barra" class="lateral-hg" aria-label="Menú principal">
    <a class="marca-hg" th:href="@{/}">
        <span class="logo-hg"><i class="bi bi-buildings-fill"></i></span>
        <span>HabitaGest</span>
    </a>
    <div class="menu-hg">
        <div class="menu-titulo"><span th:replace="~{fragmentos :: rol}"></span></div>
        <a class="item-hg" th:classappend="${rutaActual == '/'} ? 'activo'" th:href="@{/}">
            <i class="bi bi-house"></i><span>Inicio</span>
        </a>
        <a class="item-hg" th:each="e : ${menuLateral}" th:classappend="${e.ruta() == rutaActual} ? 'activo'" th:href="@{${e.ruta()}}">
            <i class="bi" th:classappend="${e.icono()}"></i><span th:text="${e.texto()}">Opción</span>
        </a>
    </div>
    <div class="usuario-caja">
        <div class="lh-sm">
            <div class="usuario-hg" sec:authentication="name"></div>
            <div class="apto-hg" th:if="${miApartamento != null and !miApartamento.isEmpty()}" th:text="${miApartamento}"></div>
        </div>
        <button class="btn-tema" type="button" onclick="cambiarTema()">
            <span class="solo-claro"><i class="bi bi-moon-stars me-1"></i>Modo oscuro</span>
            <span class="solo-oscuro"><i class="bi bi-sun me-1"></i>Modo claro</span>
        </button>
        <form th:action="@{/logout}" method="post">
            <button class="btn-salir" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Salir</button>
        </form>
    </div>
</nav>
<span th:fragment="rol">
        <span sec:authorize="hasRole('ADMIN_SISTEMA')">Administrador del sistema</span>
        <span sec:authorize="hasRole('ADMIN_CONJUNTO')">Administrador del conjunto</span>
        <span sec:authorize="hasRole('CONSEJO')">Consejo de administración</span>
        <span sec:authorize="hasRole('PROPIETARIO')">Propietario</span>
        <span sec:authorize="hasRole('RESIDENTE')">Residente</span>
        <span sec:authorize="hasRole('PORTERO')">Portero</span>
        <span sec:authorize="hasRole('VIGILANTE')">Vigilante</span>
        <span sec:authorize="hasRole('CONTADOR')">Contador</span>
        <span sec:authorize="hasRole('REVISOR_FISCAL')">Revisor fiscal</span>
        <span sec:authorize="hasRole('ENCARGADO_MANTENIMIENTO')">Encargado de mantenimiento</span>
        <span sec:authorize="hasRole('PROVEEDOR')">Proveedor</span>
</span>
<span th:fragment="icono" class="d-inline-flex">
        <span class="icono-rol" style="--acc: #6f42c1;" sec:authorize="hasRole('ADMIN_SISTEMA')"><i class="bi bi-gear-fill"></i></span>
        <span class="icono-rol" style="--acc: #0d6efd;" sec:authorize="hasRole('ADMIN_CONJUNTO')"><i class="bi bi-buildings-fill"></i></span>
        <span class="icono-rol" style="--acc: #0aa2c0;" sec:authorize="hasRole('CONSEJO')"><i class="bi bi-people-fill"></i></span>
        <span class="icono-rol" style="--acc: #198754;" sec:authorize="hasRole('PROPIETARIO')"><i class="bi bi-house-door-fill"></i></span>
        <span class="icono-rol" style="--acc: #12a37f;" sec:authorize="hasRole('RESIDENTE')"><i class="bi bi-person-fill"></i></span>
        <span class="icono-rol" style="--acc: #fd7e14;" sec:authorize="hasRole('PORTERO')"><i class="bi bi-door-open-fill"></i></span>
        <span class="icono-rol" style="--acc: #dc3545;" sec:authorize="hasRole('VIGILANTE')"><i class="bi bi-shield-check"></i></span>
        <span class="icono-rol" style="--acc: #0b7285;" sec:authorize="hasRole('CONTADOR')"><i class="bi bi-cash-coin"></i></span>
        <span class="icono-rol" style="--acc: #6c757d;" sec:authorize="hasRole('REVISOR_FISCAL')"><i class="bi bi-clipboard2-check-fill"></i></span>
        <span class="icono-rol" style="--acc: #d9822b;" sec:authorize="hasRole('ENCARGADO_MANTENIMIENTO')"><i class="bi bi-tools"></i></span>
        <span class="icono-rol" style="--acc: #8e5ea2;" sec:authorize="hasRole('PROVEEDOR')"><i class="bi bi-truck"></i></span>
</span>
</body>
</html>
