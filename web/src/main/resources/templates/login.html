<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos :: cabecera}"></head>
<body class="fondo-acceso">
<main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="tarjeta-acceso">
        <div class="text-center mb-4">
            <span class="logo-acceso"><i class="bi bi-buildings-fill"></i></span>
            <h1 class="h3 mt-3 mb-1">HabitaGest</h1>
            <p class="text-muted mb-0">Gestión de conjuntos residenciales</p>
        </div>
        <div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
        <div class="alert alert-success" th:if="${param.salio}">Cerraste la sesión.</div>
        <form th:action="@{/login}" method="post">
            <label class="form-label" for="username">Usuario</label>
            <input class="form-control mb-3" type="text" id="username" name="username" required autofocus>
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control mb-4" type="password" id="password" name="password" required>
            <button class="btn btn-hg w-100" type="submit">Entrar</button>
        </form>
    </div>
</main>
</body>
</html>
