<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HabitaGest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 10vh;">
    <h1 class="h3 mb-4 text-center">HabitaGest</h1>
    <div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
    <div class="alert alert-success" th:if="${param.salio}">Cerraste la sesión.</div>
    <form th:action="@{/login}" method="post" class="card card-body shadow-sm">
        <label class="form-label" for="username">Usuario</label>
        <input class="form-control mb-3" type="text" id="username" name="username" required autofocus>
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control mb-3" type="password" id="password" name="password" required>
        <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
</div>
</body>
</html>
