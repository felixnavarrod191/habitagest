spring.application.name=web
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=web_db
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.data.mongodb.auto-index-creation=true
gateway.url=${GATEWAY_URL:http://localhost:8090}

# La página se arma completa antes de enviarse: así el token CSRF y la cookie de sesión del formulario de acceso
# se pueden crear aunque la cabecera de la página sea larga.
spring.thymeleaf.servlet.produce-partial-output-while-processing=false
